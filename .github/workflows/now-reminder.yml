name: Now Page Reminder

on:
  schedule:
    - cron: '0 17 * * 1'
  workflow_dispatch:

jobs:
  check-staleness:
    name: Check if /now is stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check last entry date
        run: |
          LAST_DATE=$(grep -oP 'datetime="\K[0-9-]+' now/index.html | head -1)
          LAST_EPOCH=$(date -d "$LAST_DATE" +%s)
          NOW_EPOCH=$(date +%s)
          DAYS_AGO=$(( (NOW_EPOCH - LAST_EPOCH) / 86400 ))
          echo "Last /now entry: $LAST_DATE ($DAYS_AGO days ago)"
          if [ "$DAYS_AGO" -gt 30 ]; then
            echo "::error::Your /now page hasn't been updated in $DAYS_AGO days. Go live a little and write about it."
            exit 1
          fi
